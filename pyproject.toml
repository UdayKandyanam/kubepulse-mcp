[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubepulse-mcp"
version = "0.1.0"
description = "An MCP server that exposes the KubePulse Kubernetes diagnosis CLI as tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
kubepulse-mcp = "kubepulse_mcp.server:main"

[tool.setuptools.packages.find]
include = ["kubepulse_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
